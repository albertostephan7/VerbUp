<script>
'use strict';
/* =====================================================================
   CONTEÚDO — edite/amplie aqui.
   Padrões de erro:  S = sujeito omitido | O = ordem/tradução literal/preposição
                     C = maiúsculas/pontuação | V = forma do verbo | P = pronúncia
   Q(tipo, enunciado, certa, porquê, [errada, padrão, explicação], ...)
        tipo: 'gap' (lacuna) | 'tr' (tradução) | 'fix' (frase correta)
   V(base, passado, particípio, tradução, exemplo, tradução do exemplo)
   B(frase, tradução, padrão, explicação, [[chip extra, padrão], ...])
   D(cenário, [['n'|'y', inglês, português], ...])  n = personagem, y = aluno
   (nas falas do aluno 'y' não use contrações: o avaliador compara palavra por palavra)
   ===================================================================== */
const PAT={
  S:{name:'Sujeito omitido',tip:'Em português o sujeito some (“Está frio”, “mas é difícil”). Em inglês cada oração precisa do seu sujeito (it, I, she…). Só pode omitir quando é o MESMO sujeito ligado por and (“I went home and ate”).'},
  O:{name:'Ordem das palavras / tradução literal / preposição',tip:'Não traduza palavra por palavra. Idade usa BE (I am 24), horas usam at, dias usam on, meses/manhã/ano usam in.'},
  C:{name:'Maiúsculas e pontuação',tip:'Comece a frase com maiúscula, escreva I, nomes de países, dias e meses com maiúscula e termine com ponto final.'},
  V:{name:'Forma do verbo',tip:'Revise a conjugação: -s na 3ª pessoa, verbo base depois de do/does/did/can/will, -ing depois de be, passado correto.'},
  P:{name:'Pronúncia (fala)',tip:'Ouça o nativo em velocidade lenta e repita as palavras problemáticas isoladamente.'}
};
const Q=(k,q,a,why,...w)=>({k,q,a,why,w});
const V=(base,past,pp,pt,ex,exPt,note)=>({base,past,pp,pt,ex,exPt,note});
const B=(s,pt,pat,why,extra)=>({s,pt,pat:pat||'O',why:why||'',extra:extra||[]});
const D=(scene,lines)=>({scene,lines});

const UNITS=[
/* ---------------------------------------------------------------- 1 */
{id:1,title:'To be',icon:'🙋',color:'#2b7bb9',desc:'Idade, profissão e origem: I am, you are, she is.',
vocab:[
 V('be','was / were','been','ser / estar','I am 24 years old.','Eu tenho 24 anos.','am · is · are'),
 V('live','lived','lived','morar','I live in Recife.','Eu moro em Recife.'),
 V('work','worked','worked','trabalhar','She works as a nurse.','Ela trabalha como enfermeira.'),
 V('study','studied','studied','estudar','He studies medicine.','Ele estuda medicina.'),
 V('speak','spoke','spoken','falar','We speak Portuguese.','Nós falamos português.'),
 V('come','came','come','vir / ser de','They come from Chile.','Eles são do Chile.')
],
quiz:[
 Q('fix','Como dizer “Eu tenho 24 anos”?','I am 24 years old.','Idade usa o verbo BE + number + years old. Em inglês nunca se usa have para idade.',
   ['I have 24 years.','O','Tradução literal de “tenho 24 anos”. Em inglês a idade é com BE, não com HAVE.'],
   ['I am 24 years.','O','Faltou “old”. A estrutura completa é BE + número + years old.'],
   ['I have 24 years old.','O','Mistura “tenho” (HAVE) com “old”. O verbo certo é BE: I am 24 years old.']),
 Q('gap','She ___ a nurse.','is','Com she/he/it usamos is.',
   ['are','V','“are” é para you/we/they.'],['am','V','“am” só combina com I.'],['be','V','Depois de she precisa da forma conjugada (is), não do verbo base.']),
 Q('tr','Escolha a tradução: “Eu sou do Brasil.”','I am from Brazil.','Origem = BE + from + país (com maiúscula).',
   ['I am of Brazil.','O','“de” vira from (origem), não of.'],
   ['I from Brazil.','V','Faltou o verbo BE: I am from Brazil.'],
   ['I am from brazil.','C','Nomes de países têm maiúscula: Brazil.']),
 Q('gap','He ___ 30 years old.','is','Idade usa BE; com he, a forma é is.',
   ['has','O','HAVE para idade é tradução literal de “tem 30 anos”.'],['have','O','HAVE para idade é tradução literal, e ainda não combina com he.'],['does','V','does é auxiliar de pergunta/negação, não substitui o BE.']),
 Q('fix','Qual frase está correta? (Moro em Recife, mas é muito quente.)','I live in Recife, but it is very hot.','Depois de but começa uma nova oração: precisa do sujeito it.',
   ['I live in Recife, but is very hot.','S','Sujeito omitido: depois de “but” há uma nova oração e ela precisa de sujeito (it).'],
   ['i live in Recife, but it is very hot.','C','“I” sempre maiúsculo e a frase começa com maiúscula.'],
   ['I live in Recife, but it very hot.','V','Faltou o verbo BE depois de it: it is.']),
 Q('gap','We ___ from Argentina.','are','we/you/they usam are.',
   ['is','V','is é para he/she/it.'],['am','V','am só combina com I.'],['be','V','Precisa da forma conjugada: are.']),
 Q('tr','Escolha a tradução: “Eu sou professor.”','I am a teacher.','Profissões levam artigo a/an em inglês.',
   ['I am teacher.','O','Em português dizemos “sou professor” sem artigo; em inglês precisa de a/an.'],
   ['I have a teacher.','O','“have” significa “ter”; para dizer o que você é, use BE.'],
   ['I am a teacher','C','Faltou o ponto final.']),
 Q('tr','Escolha a tradução: “Está frio hoje.”','It is cold today.','Em inglês o sujeito it é obrigatório em clima, hora e distância.',
   ['Is cold today.','S','Sujeito omitido: em português “Está frio” não tem sujeito, em inglês precisa de it.'],
   ['It has cold today.','O','“Ter frio” (sensação) é feeling; clima é it is cold. Não use have.'],
   ['It is cold today','C','Faltou o ponto final.']),
 Q('gap','I am 24 years ___.','old','A estrutura é I am 24 years old.',
   ['age','O','“age” não funciona aqui: years old.'],['of','O','“years of” é tradução literal; o certo é years old.'],['years','O','Repetiu “years”; falta o adjetivo old.']),
 Q('fix','Qual frase está correta? (Meus pais são médicos.)','My parents are doctors.','Plural pede are e a profissão também no plural.',
   ['My parents is doctors.','V','parents é plural → are.'],['My parents are doctor.','V','Sujeito plural, profissão no plural: doctors.'],['My parents have doctors.','O','have = ter. Aqui o sentido é “ser”: are.'])
],
build:[
 B('I am 24 years old.','Eu tenho 24 anos.','O','Idade usa BE: I am 24 years old.',[['have','O']]),
 B('She is from Brazil.','Ela é do Brasil.','C','País com maiúscula e frase com ponto final.',[['brazil.','C']]),
 B('My brother is a doctor.','Meu irmão é médico.','O','Profissão leva artigo: is a doctor.'),
 B('It is cold today.','Está frio hoje.','S','Em inglês o sujeito it é obrigatório.'),
 B('I live in Recife, but it is hot.','Moro em Recife, mas está quente.','S','Depois de but entra uma nova oração: repita o sujeito (it).')
],
dialog:D('Small talk: conhecendo um colega de trabalho',[
 ['n','Hi! My name is Sam. What is your name?','Oi! Meu nome é Sam. Qual é o seu nome?'],
 ['y','Hi, my name is Ana. Nice to meet you.','Oi, meu nome é Ana. Prazer em conhecer você.'],
 ['n','Nice to meet you too. How old are you?','Prazer também. Quantos anos você tem?'],

/* =====================================================================
   AVALIAÇÃO DE FALA
   ===================================================================== */
const NUMW={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};
const CONTR={"i'm":'i am',"you're":'you are',"he's":'he is',"she's":'she is',"it's":'it is',"we're":'we are',"they're":'they are',"don't":'do not',"doesn't":'does not',"didn't":'did not',"can't":'cannot',"won't":'will not',"isn't":'is not',"aren't":'are not',"wasn't":'was not',"i'll":'i will',"i've":'i have',"let's":'let us',"what's":'what is',"that's":'that is',"there's":'there is',"here's":'here is',"i'd":'i would',"you'll":'you will',"ok":'okay'};
const HOM={too:'to',their:'there',"they're":'there'};
function norm(s){
  let t=String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/-/g,' ').replace(/[^a-z0-9'\s]/g,' ').split(/\s+/).filter(Boolean);
  let out=[];
  for(const w of t){const c=CONTR[w];if(c)out.push(...c.split(' '));else out.push(w);}
  t=out;out=[];
  for(let i=0;i<t.length;i++){
    const w=t[i];
    if(w in NUMW){
      let n=NUMW[w];
      if(n>=20&&n%10===0&&i+1<t.length&&t[i+1] in NUMW&&NUMW[t[i+1]]>=1&&NUMW[t[i+1]]<=9){n+=NUMW[t[i+1]];i++;}
      out.push(String(n));
    }else out.push(HOM[w]||w);
  }
  return out;
}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
const sim=(a,b)=>1-lev(a,b)/Math.max(a.length,b.length,1);
/* Levenshtein no nível de palavras, com custo 0.5 para palavras parecidas (pronúncia) */
function align(t,h){
  const n=t.length,m=h.length,d=[],b=[];
  for(let i=0;i<=n;i++){d.push(new Array(m+1).fill(0));b.push(new Array(m+1).fill(''));}
  for(let i=1;i<=n;i++){d[i][0]=i;b[i][0]='D';}
  for(let j=1;j<=m;j++){d[0][j]=j;b[0][j]='I';}
  const sc=(x,y)=>x===y?0:(sim(x,y)>=0.6?0.5:1);
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++){
    let best=d[i-1][j-1]+sc(t[i-1],h[j-1]),op='M';
    if(d[i-1][j]+1<best){best=d[i-1][j]+1;op='D';}
    if(d[i][j-1]+1<best){best=d[i][j-1]+1;op='I';}
    d[i][j]=best;b[i][j]=op;
  }
  const ops=[];let i=n,j=m;
  while(i>0||j>0){
    const op=b[i][j];
    if(op==='M'){const x=t[i-1],y=h[j-1];ops.push({s:x===y?'ok':(sim(x,y)>=0.6?'near':'bad'),ti:i-1,t:x,h:y});i--;j--;}
    else if(op==='D'){ops.push({s:'miss',ti:i-1,t:t[i-1]});i--;}
    else{ops.push({s:'extra',h:h[j-1]});j--;}
  }
  return ops.reverse();
}
function scoreOps(ops,n,conf){
  const ok=ops.filter(o=>o.s==='ok').length,near=ops.filter(o=>o.s==='near').length,extra=ops.filter(o=>o.s==='extra').length;
  const acc=n?(ok+0.5*near)/(n+0.5*extra):0;
  const c=conf>0?conf:acc;
  return {acc,conf:c,score:Math.max(0,Math.min(100,Math.round(100*(0.7*acc+0.3*c))))};
}
/* alts: [{t:'texto', c:confiança}] — escolhe a melhor alternativa */
function evaluate(target,alts){
  const tt=norm(target);let best=null;
  const cands=alts&&alts.length?alts:[{t:'',c:0}];
  for(const a of cands){
    const ops=align(tt,norm(a.t));
    const sc=scoreOps(ops,tt.length,a.c||0);
    if(!best||sc.score>best.score)best={ops,said:a.t,...sc};
  }
  return best;
}
function opsHTML(ops,disp){
  return ops.map(o=>{
    if(o.s==='extra')return `<span class="w extra">${esc(o.h)}</span>`;
    const cls={ok:'ok',near:'near',bad:'bad',miss:'bad'}[o.s];
    const tip=o.s==='miss'?'faltou':(o.h&&o.h!==o.t?'ouvi: '+o.h:'');
    return `<span class="w ${cls}" title="${esc(tip)}">${esc(disp[o.ti]||o.t)}</span>`;
  }).join(' ');
}

/* ---------------- captura: MediaRecorder + SpeechRecognition ao mesmo tempo ---------------- */
const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
function micMsg(e){
  const n=e&&e.name;
  if(n==='NotAllowedError'||n==='SecurityError')return 'Permissão do microfone negada. Clique no cadeado ao lado do endereço, permita o microfone e tente de novo. (Abra via http://localhost, não via file://.)';
  if(n==='NotFoundError'||n==='OverconstrainedError')return 'Nenhum microfone encontrado. Conecte um microfone e tente de novo.';
  if(n==='NotReadableError')return 'O microfone está sendo usado por outro programa. Feche-o e tente de novo.';
  return 'Não consegui acessar o microfone ('+(n||'erro')+').';
}
async function startCapture(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw {name:'NoMediaDevices'};
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const cap={stream,chunks:[],finals:[],interim:'',srErr:null,mr:null,sr:null,mime:'',mrDone:Promise.resolve(),srDone:Promise.resolve()};
  if(window.MediaRecorder){
    try{
      const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(m=>MediaRecorder.isTypeSupported(m));
      cap.mr=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);cap.mime=cap.mr.mimeType||mime||'';
      cap.mr.ondataavailable=e=>{if(e.data&&e.data.size)cap.chunks.push(e.data);};
      cap.mrDone=new Promise(r=>{cap.mr.onstop=r;});
      cap.mr.start();
    }catch(e){cap.mr=null;cap.mrDone=Promise.resolve();}
  }
  if(SRC){
    try{
      const sr=new SRC();sr.lang='en-US';sr.interimResults=true;sr.maxAlternatives=3;sr.continuous=true;
      sr.onresult=e=>{
        for(let i=e.resultIndex;i<e.results.length;i++){
          const res=e.results[i];
          if(res.isFinal)cap.finals[i]=Array.from(res).map(a=>({t:a.transcript,c:a.confidence||0}));
          else cap.interim=res[0].transcript;
        }
        if(cap.onInterim){const f=cap.finals.filter(Boolean).map(s=>s[0].t).join(' ');cap.onInterim((f+' '+cap.interim).trim());}
      };
      sr.onerror=e=>{cap.srErr=e.error;};
      cap.srDone=new Promise(r=>{sr.onend=r;});
      cap.sr=sr;sr.start();
    }catch(e){cap.srErr='start';cap.srDone=Promise.resolve();}
  }
  return cap;
}
function buildAlts(cap){
  const segs=cap.finals.filter(Boolean);
  if(!segs.length)return cap.interim?[{t:cap.interim,c:0}]:[];
  const out=[];
  for(let k=0;k<3;k++){const parts=segs.map(s=>s[k]||s[0]);out.push({t:parts.map(p=>p.t.trim()).join(' '),c:avg(parts.map(p=>p.c))});}
  return out;
}
async function stopCapture(cap){
  try{if(cap.mr&&cap.mr.state!=='inactive')cap.mr.stop();}catch(e){}
  try{if(cap.sr)cap.sr.stop();}catch(e){}
  await Promise.race([Promise.all([cap.mrDone,cap.srDone]),new Promise(r=>setTimeout(r,3000))]);
  cap.stream.getTracks().forEach(t=>t.stop());
  const blob=cap.chunks.length?new Blob(cap.chunks,{type:cap.mime||'audio/webm'}):null;
  return {url:blob?URL.createObjectURL(blob):null,alts:buildAlts(cap),srErr:cap.srErr};
}

function openLesson(u,kind){
  const U=UNITS[u];
  if(kind==='vocab')return renderVocab(u);
  let steps;
  if(kind==='quiz')steps=U.quiz.map((_,i)=>({k:'quiz',u,i}));
  else if(kind==='build')steps=U.build.map((_,i)=>({k:'build',u,i}));
  else steps=U.dialog.lines.map((l,i)=>l[0]==='y'?{k:'speak',u,i}:null).filter(Boolean);
  startSession({title:U.title,steps,u,lesson:kind,review:false});
}
function startReview(){
  const steps=Object.values(S.review).map(v=>({k:v.t==='q'?'quiz':v.t==='b'?'build':'speak',u:v.u,i:v.i})).filter(s=>UNITS[s.u]);
  if(!steps.length){toast('Nada para revisar.');return;}
  startSession({title:'Revisão',steps:shuffle(steps),u:null,lesson:'review',review:true});
}

/* =====================================================================
   LIÇÃO 1: VOCABULÁRIO
   ===================================================================== */
function renderVocab(u,idx){
  idx=idx||0;
  const U=UNITS[u],v=U.vocab[idx],last=idx===U.vocab.length-1;
  view(`
  <div class="top"><button class="x" id="close">✕</button><div class="bar"><i style="width:${Math.round(idx/U.vocab.length*100)}%"></i></div>${rateHTML()}</div>
  <div class="card vcard"><div class="muted">Verbo ${idx+1} de ${U.vocab.length}</div>
    <div class="big">${esc(v.base)}</div><div style="font-size:1.2rem;font-weight:700">${esc(v.pt)}</div>
    <div class="forms"><div><small>Base</small><b>${esc(v.base)}</b></div><div><small>Passado</small><b>${esc(v.past)}</b></div><div><small>Particípio</small><b>${esc(v.pp)}</b></div></div>
    ${v.note?`<div class="muted">Dica: ${esc(v.note)}</div>`:''}
    <div class="ex"><b>${esc(v.ex)}</b><div class="muted">${esc(v.exPt)}</div></div>
    <div class="row"><button class="btn blue sm" id="s1">🔊 Ouvir o verbo</button><button class="btn blue sm" id="s2">🔊 Ouvir a frase</button></div>
    <div class="dots">${U.vocab.map((_,i)=>`<i class="${i===idx?'on':''}"></i>`).join('')}</div></div>
  <div class="foot"><div class="in">${idx>0?'<button class="btn ghost" id="prev">Voltar</button>':''}<button class="btn" id="next">${last?'Concluir':'Próximo'}</button></div></div>`);
  bindRate(app);
  $('#close').onclick=renderHome;
  $('#s1').onclick=()=>speak(v.base.replace(/ \+ verbo/,''));
  $('#s2').onclick=()=>speak(v.ex);
  const p=$('#prev');if(p)p.onclick=()=>renderVocab(u,idx-1);
  $('#next').onclick=()=>{
    if(!last)return renderVocab(u,idx+1);
    ses={title:U.title,steps:[],i:0,xp:20,ok:0,tot:0,speech:[],errs:[],u,lesson:'vocab',review:false};
    finishSession();
  };
  if(!TEST)speak(v.base.replace(/ \+ verbo/,''));
}

/* =====================================================================
   MOTOR DE SESSÃO (quiz / montar / falar / revisão)
   ===================================================================== */
let ses=null;
function startSession(o){ses=Object.assign({i:0,xp:0,ok:0,tot:0,speech:[],errs:[]},o);renderStep();}
function topbar(){return `<div class="top"><button class="x" id="close">✕</button><div class="bar"><i style="width:${Math.round(ses.i/ses.steps.length*100)}%"></i></div>${rateHTML()}</div>`;}
function bindTop(){bindRate(app);$('#close').onclick=renderHome;}
function nextStep(){ses.i++;if(ses.i>=ses.steps.length)finishSession();else renderStep();}
function renderStep(){
  const st=ses.steps[ses.i];
  if(st.k==='quiz')renderQuiz(st);else if(st.k==='build')renderBuild(st);else renderSpeak(st);
}
function addXP(n,el){ses.xp+=n;if(el)pop(el,'+'+n+' XP');}
function logErr(pat,said,right,ex){ses.errs.push({pat,said,right,ex});}
function footNext(label,enabled){return `<div class="foot"><div class="in"><button class="btn" id="next" ${enabled?'':'disabled'}>${label||'Continuar'}</button></div></div>`;}

/* ---------------- múltipla escolha ---------------- */
const KIND={gap:'Complete a lacuna',tr:'Escolha a tradução certa',fix:'Qual frase está correta?'};
function renderQuiz(st){
  const q=UNITS[st.u].quiz[st.i];
  const opts=shuffle([{t:q.a,ok:true}].concat(q.w.map(w=>({t:w[0],pat:w[1],ex:w[2]}))));
  view(`${topbar()}
  <div class="card"><div class="q-kind">${KIND[q.k]||''}${ses.review?' · revisão':''}</div><div class="q-text">${esc(q.q)}</div>
  <div id="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.t)}</button>`).join('')}</div>
  <div id="fb"></div></div>${footNext('Continuar',false)}`);
  bindTop();
  $$('.opt').forEach(b=>b.onclick=()=>{
    const o=opts[+b.dataset.i];
    $$('.opt').forEach(x=>{x.disabled=true;if(opts[+x.dataset.i].ok)x.classList.add('right');});
    ses.tot++;
    let fb;
    if(o.ok){
      b.classList.add('right');ses.ok++;addXP(10,b);
      if(ses.review)delReview('q',st.u,st.i);
      fb=`<div class="fb good"><b>✔ Correto.</b><p>${esc(q.why)}</p></div>`;
    }else{
      b.classList.add('wrong');
      addReview('q',st.u,st.i);logErr(o.pat,o.t,q.a,o.ex);
      fb=`<div class="fb bad"><b class="tag">${esc(PAT[o.pat].name)}</b><b>Você escolheu:</b> ${esc(o.t)}<p><b>Por que está errado:</b> ${esc(o.ex)}</p><p><b>Certa:</b> ${esc(q.a)}<br>${esc(q.why)}</p></div>`;
    }
    $('#fb').innerHTML=fb+`<button class="btn blue sm" id="hear">🔊 Ouvir a frase certa</button>`;
    $('#hear').onclick=()=>speak(q.a);
    $('#next').disabled=false;
  });
  $('#next').onclick=nextStep;
}

/* ---------------- montar a frase ---------------- */
function renderBuild(st){
  const it=UNITS[st.u].build[st.i];
  const words=it.s.split(' ').map(w=>({w,x:false})).concat(it.extra.map(e=>({w:e[0],x:true,pat:e[1]})));
  const chips=shuffle(words);
  let ans=[];
  view(`${topbar()}
  <div class="card"><div class="q-kind">Monte a frase${ses.review?' · revisão':''}</div><div class="q-text">${esc(it.pt)}</div>
  <div class="slot" id="slot"></div><div class="bank" id="bank">${chips.map((c,i)=>`<button class="chip" data-i="${i}">${esc(c.w)}</button>`).join('')}</div>
  <div id="fb"></div></div>
  <div class="foot"><div class="in"><button class="btn ghost" id="clr">Limpar</button><button class="btn" id="chk" disabled>Verificar</button></div></div>`);
  bindTop();
  let done=false;
  const paint=()=>{
    $('#slot').innerHTML=ans.map((ci,p)=>`<button class="chip" data-p="${p}">${esc(chips[ci].w)}</button>`).join('');
    $$('#bank .chip').forEach(b=>b.classList.toggle('used',ans.includes(+b.dataset.i)));
    $('#chk').disabled=done||!ans.length;
    if(!done)$$('#slot .chip').forEach(b=>b.onclick=()=>{ans.splice(+b.dataset.p,1);paint();});
  };
  $$('#bank .chip').forEach(b=>b.onclick=()=>{if(done||ans.includes(+b.dataset.i))return;ans.push(+b.dataset.i);paint();});
  $('#clr').onclick=()=>{if(done)return;ans=[];paint();};
  $('#chk').onclick=()=>{
    if(done)return;done=true;
    const got=ans.map(i=>chips[i].w);const sentence=got.join(' ');
    ses.tot++;
    const gw=got,tw=it.s.split(' ');
    if(sentence===it.s){
      ses.ok++;addXP(10,$('#chk'));if(ses.review)delReview('b',st.u,st.i);
      $('#fb').innerHTML=`<div class="fb good"><b>✔ Frase correta.</b><p>${esc(it.s)}</p>${it.why?`<p>${esc(it.why)}</p>`:''}</div><button class="btn blue sm" id="hear">🔊 Ouvir</button>`;
    }else{
      let pat=it.pat;const usedExtra=ans.map(i=>chips[i]).find(c=>c.x);
      if(usedExtra)pat=usedExtra.pat;
      else if(sentence.toLowerCase()===it.s.toLowerCase())pat='C';
      addReview('b',st.u,st.i);
      const diff=gw.map((w,i)=>`<span class="w ${w===tw[i]?'ok':'bad'}">${esc(w)}</span>`).join(' ');
      let why=it.why;
      if(usedExtra)why=`Você usou “${usedExtra.w}”, que não pertence à frase. ${it.why}`;
      logErr(pat,sentence,it.s,why||PAT[pat].tip);
      $('#fb').innerHTML=`<div class="fb bad"><b class="tag">${esc(PAT[pat].name)}</b><p><b>Sua frase:</b> ${diff}</p><p><b>Correta:</b> ${esc(it.s)}</p><p>${esc(why||PAT[pat].tip)}</p></div><button class="btn blue sm" id="hear">🔊 Ouvir a frase certa</button>`;
    }
    $('#hear').onclick=()=>speak(it.s);
    $('#chk').disabled=true;$('#chk').textContent='Verificar';
    const nb=document.createElement('button');nb.className='btn';nb.id='next';nb.textContent='Continuar';
    $('#chk').replaceWith(nb);nb.onclick=nextStep;
    $$('#slot .chip').forEach(b=>b.onclick=null);
  };
  paint();
}

/* ---------------- conversa falada ---------------- */
function renderSpeak(st){
  const U=UNITS[st.u],lines=U.dialog.lines,line=lines[st.i],target=line[1];
  const disp=target.split(/\s+/);
  const hist=lines.slice(0,st.i).map(l=>l[0]==='n'
    ?`<div class="bub n">${esc(l[1])} <button class="say" data-say="${esc(l[1])}" title="Ouvir">🔊</button><small>${esc(l[2])}</small></div>`
    :`<div class="bub y">${esc(l[1])}</div>`).join('');
  const prevN=st.i>0&&lines[st.i-1][0]==='n'?lines[st.i-1][1]:null;
  view(`${topbar()}
  <div class="muted" style="margin-bottom:8px">📍 ${esc(U.dialog.scene)}${ses.review?' · revisão':''}</div>
  ${!SRC?'<div class="warn"><b>Sem reconhecimento de voz neste navegador.</b> Use Chrome ou Edge para receber nota. Aqui a gravação serve só para você se ouvir e se autoavaliar.</div>':''}
  ${location.protocol==='file:'?'<div class="warn err">Aberto via file://. Rode <code>python -m http.server 8000</code> e acesse http://localhost:8000.</div>':''}
  <div class="chat">${hist}</div>
  <div class="card"><div class="q-kind">Sua vez — diga em voz alta</div>
    <div class="target" id="tg">${esc(target)}</div>
    <div><button class="btn ghost sm" id="trT">👁 Mostrar tradução</button> <span id="tr" class="muted" hidden>${esc(line[2])}</span></div>
    <div class="row"><button class="btn blue sm" id="hearN">🔊 Ouvir o nativo</button></div>
    <button class="mic" id="mic" title="Gravar">🎤</button>
    <div id="status" class="muted" style="text-align:center">Toque no microfone, fale a frase e toque de novo para parar.</div>
    <div id="res"></div></div>
  <div class="foot"><div class="in"><button class="btn ghost" id="skip" hidden>Pular mesmo assim</button><button class="btn" id="next" disabled>Continuar</button></div></div>`);
  bindTop();
  $$('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say));
  $('#trT').onclick=()=>{const t=$('#tr');t.hidden=!t.hidden;$('#trT').textContent=t.hidden?'👁 Mostrar tradução':'🙈 Esconder tradução';};
  $('#hearN').onclick=()=>speak(target);
  if(prevN&&!TEST)speak(prevN);

  let cap=null,attempts=0,best=-1,first=null,busy=false,tmr=null,passed=false,recorded=false,lastErrLogged=false;
  const status=t=>{$('#status').innerHTML=t;};
  const finishStep=(counted)=>{
    if(counted&&best>=0){ses.speech.push(best);ses.tot++;if(best>=70){ses.ok++;addXP(10);}}
    nextStep();
  };
  $('#next').onclick=()=>{
    if(!SRC){ses.tot++;ses.ok++;addXP(5);if(ses.review)delReview('s',st.u,st.i);nextStep();return;}
    if(ses.review&&passed)delReview('s',st.u,st.i);
    finishStep(true);
  };
  $('#skip').onclick=()=>{finishStep(true);};
  $('#mic').onclick=async()=>{
    if(busy)return;
    if(cap){ // parar
      busy=true;clearTimeout(tmr);$('#mic').classList.remove('rec');status('Processando…');
      const c=cap;cap=null;
      const r=await stopCapture(c);busy=false;onCaptured(r);return;
    }
    stopAudio();
    try{cap=await startCapture();}catch(e){status('<span style="color:var(--red-d)">'+esc(micMsg(e))+'</span>');cap=null;return;}
    $('#mic').classList.add('rec');$('#res').innerHTML='';
    status('🔴 Gravando… fale agora. Toque para parar.');
    cap.onInterim=t=>{if(t)status('🔴 Ouvindo: <i>'+esc(t)+'</i>');};
    tmr=setTimeout(()=>{if(cap)$('#mic').click();},14000);
  };
  function onCaptured(r){
    recorded=true;
    const ownBtn=r.url?`<button class="btn ghost sm" id="own">▶ Ouvir minha gravação</button>`:'';
    if(!SRC){
      status('Gravação pronta. Ouça e compare com o nativo.');
      $('#res').innerHTML=`<div class="fb good"><p>Sem nota automática neste navegador. Ouça a si mesmo e compare com o nativo: ritmo, final das palavras e sons como “th”, “-ed”, “-s”.</p></div><div class="row">${ownBtn}<button class="btn blue sm" id="nat">🔊 Ouvir o nativo</button></div>`;
      if(r.url)$('#own').onclick=()=>playUrl(r.url);
      $('#nat').onclick=()=>speak(target);
      $('#next').disabled=false;return;
    }
    const hasText=r.alts.length&&r.alts.some(a=>a.t.trim());
    if(!hasText&&r.srErr&&r.srErr!=='no-speech'&&r.srErr!=='aborted'){
      const m={'not-allowed':'O navegador bloqueou o reconhecimento de voz. Libere o microfone para este site.','service-not-allowed':'O reconhecimento de voz está bloqueado neste navegador.','network':'O reconhecimento de voz do Chrome precisa de internet. Verifique a conexão.','audio-capture':'Não consegui capturar o áudio do microfone.'}[r.srErr]||('Erro no reconhecimento de voz: '+r.srErr);
      status('<span style="color:var(--red-d)">'+esc(m)+'</span>');
      $('#res').innerHTML=r.url?`<div class="row">${ownBtn}</div>`:'';if(r.url)$('#own').onclick=()=>playUrl(r.url);
      return;
    }
    attempts++;
    const ev=evaluate(target,hasText?r.alts:[]);
    if(first===null)first=ev.score;
    best=Math.max(best,ev.score);
    const bad=ev.ops.filter(o=>o.s==='near'||o.s==='bad'||o.s==='miss');
    passed=best>=70;
    if(first<70&&!lastErrLogged){lastErrLogged=true;addReview('s',st.u,st.i);
      logErr('P',ev.said||'(nada reconhecido)',target,bad.length?'Palavras com problema: '+bad.map(o=>o.t).join(', ')+'.':'Nota baixa de pronúncia.');}
    const col=ev.score>=70?'var(--green-d)':ev.score>=40?'var(--orange)':'var(--red-d)';
    status(hasText?'Pronto.':'Não ouvi nada. Fale mais perto do microfone e tente de novo.');
    $('#res').innerHTML=`
      <div class="score" style="color:${col}">${ev.score}<span style="font-size:1rem">/100</span></div>
      <div class="muted" style="text-align:center">Palavras ${Math.round(ev.acc*100)}% (peso 70%) · Confiança ${Math.round(ev.conf*100)}% (peso 30%)</div>
      <div class="target" style="margin-top:10px">${opsHTML(ev.ops,disp)}</div>
      <div class="muted"><span class="w ok">certa</span> <span class="w near">parecida (pronúncia)</span> <span class="w bad">faltou/trocada</span> <span class="w extra">extra</span></div>
      <div class="cmp"><div><small>Você disse</small>${esc(ev.said||'(nada reconhecido)')}</div><div><small>Esperado</small>${esc(target)}</div></div>
      ${bad.length?`<div><b>Palavras para treinar:</b>${bad.map(o=>{const w=(disp[o.ti]||o.t).replace(/[^A-Za-z0-9']/g,'');return `<div class="prob"><button class="btn blue sm" data-w="${esc(w)}">🐢 ${esc(w)}</button><span class="muted">${o.s==='miss'?'faltou':(o.h?'ouvi “'+esc(o.h)+'”':'')}</span></div>`;}).join('')}</div>`:''}
      <div class="row">${ownBtn}<button class="btn blue sm" id="nat">🔊 Ouvir o nativo</button></div>
      ${ev.score<70?`<div class="fb bad"><b>Nota abaixo de 70.</b> Repita a frase antes de avançar${attempts>=3?' (ou pule se estiver travado)':''}.</div>`:'<div class="fb good"><b>✔ Boa!</b> Você pode avançar.</div>'}`;
    if(r.url)$('#own').onclick=()=>playUrl(r.url);
    $('#nat').onclick=()=>speak(target);
    $$('[data-w]').forEach(b=>b.onclick=()=>speak(b.dataset.w,0.6));
    $('#next').disabled=!passed;
    $('#skip').hidden=passed||attempts<3;
  }
  st._test={onCaptured};
}

/* =====================================================================
   FIM DA LIÇÃO
   ===================================================================== */
function finishSession(){
  const s=ses;
  if(!s.review){S.done[s.u+':'+s.lesson]=1;s.xp+=10;}
  S.xp+=s.xp;touchStreak();save();
  const sAvg=s.speech.length?Math.round(avg(s.speech)):null;
  const groups={};s.errs.forEach(e=>(groups[e.pat]=groups[e.pat]||[]).push(e));
  const order=['S','O','C','V','P'].filter(p=>groups[p]);
  view(`
  <div class="card" style="text-align:center"><div style="font-size:3rem">${s.errs.length?'💪':'🎉'}</div><div class="big-n">${s.review?'Revisão concluída':'Lição concluída!'}</div>
    <div class="stats" style="margin-top:14px"><div><div class="big-n" style="color:var(--orange)">+${s.xp}</div><span class="muted">XP ganho</span></div>
    <div><div class="big-n">${s.tot?s.ok+'/'+s.tot:'—'}</div><span class="muted">Acertos</span></div>
    <div><div class="big-n">${sAvg===null?'—':sAvg}</div><span class="muted">Nota de fala</span></div></div></div>
  <div class="card"><h3 style="margin-top:0">Seus erros desta lição</h3>
  ${order.length?order.map(p=>`<div class="errgrp"><b>${esc(PAT[p].name)}</b> <span class="muted">(${groups[p].length})</span><div class="muted" style="margin:4px 0">${esc(PAT[p].tip)}</div><ul style="padding-left:18px;margin:6px 0">${groups[p].map(e=>`<li><s style="color:var(--red-d)">${esc(e.said)}</s> → <b style="color:var(--green-d)">${esc(e.right)}</b><br><span class="muted">${esc(e.ex)}</span></li>`).join('')}</ul></div>`).join(''):'<p>Nenhum erro nesta lição. Sem desculpas para o próximo nível. 🚀</p>'}
  </div>
  <div class="row"><button class="btn" id="home">Voltar à trilha</button>${Object.keys(S.review).length?'<button class="btn red" id="rev">Revisar erros</button>':''}</div>`);
  $('#home').onclick=renderHome;const rv=$('#rev');if(rv)rv.onclick=startReview;
}

/* =====================================================================
   AUTO-TESTE (abra index.html#selftest) — valida conteúdo, avaliador e telas
   ===================================================================== */
function selfTest(){
  const errs=[],ok=m=>{};
  const chk=(c,m)=>{if(!c)errs.push(m);};
  UNITS.forEach((U,ui)=>{
    chk(U.vocab.length>=5,'U'+(ui+1)+' vocab curto');
    chk(U.quiz.length>=8&&U.quiz.length<=10,'U'+(ui+1)+' quiz fora de 8-10: '+U.quiz.length);
    U.quiz.forEach((q,i)=>{
      chk(q.w.length===3,`U${ui+1}Q${i+1} precisa de 3 erradas`);
      const all=[q.a].concat(q.w.map(w=>w[0]));chk(new Set(all).size===all.length,`U${ui+1}Q${i+1} opções repetidas`);
      q.w.forEach(w=>chk(PAT[w[1]]&&w[2],`U${ui+1}Q${i+1} padrão/explicação inválidos`));
      chk(KIND[q.k],`U${ui+1}Q${i+1} tipo inválido`);
    });
    U.build.forEach((b,i)=>{b.extra.forEach(e=>chk(PAT[e[1]],`U${ui+1}B${i+1} extra inválido`));b.extra.forEach(e=>chk(!b.s.split(' ').includes(e[0]),`U${ui+1}B${i+1} extra igual a chip real`));});
    U.dialog.lines.forEach((l,i)=>{if(l[0]==='y'){chk(norm(l[1]).length===l[1].split(/\s+/).length,`U${ui+1} fala ${i} tokens != palavras: ${l[1]}`);chk(!/[a-z]'[a-z]/i.test(l[1].replace(/o'clock/g,'')),`U${ui+1} fala ${i} tem contração`);}});
  });
  // avaliador
  const t='I went home and ate dinner.';
  let e=evaluate(t,[{t:'I went home and ate dinner',c:0.9}]);chk(e.score>=95,'perfeito deveria ser >=95: '+e.score);
  e=evaluate(t,[{t:'I went home and eat dinner',c:0.9}]);chk(e.ops.some(o=>o.s==='bad'||o.s==='near'),'eat vs ate deveria marcar');
  e=evaluate(t,[{t:'I went to home and ate dinner',c:0.9}]);chk(e.ops.some(o=>o.s==='extra'&&o.h==='to'),'extra "to" não detectado');
  e=evaluate(t,[{t:'went home ate dinner',c:0.9}]);chk(e.ops.filter(o=>o.s==='miss').length===2,'faltas não detectadas');
  e=evaluate(t,[{t:'banana',c:0.5}]);chk(e.score<30,'lixo deveria ser baixo: '+e.score);
  e=evaluate('I am 24 years old.',[{t:"I'm twenty four years old",c:0.8}]);chk(e.score>=90,'contração/numeral: '+e.score);
  e=evaluate(t,[]);chk(e.score===0,'vazio deve ser 0');
  e=evaluate(t,[{t:'i want home and ate dinner',c:0.5},{t:'I went home and ate dinner',c:0.8}]);chk(e.score>=90,'melhor alternativa não escolhida');
  e=evaluate('I went home.',[{t:'I want home',c:0.9}]);chk(e.ops.some(o=>o.s==='near'),'went/want deveria ser parecida');
  // telas
  try{
    renderHome();
    UNITS.forEach((U,ui)=>{
      renderVocab(ui);
      ['quiz','build','speak'].forEach(k=>{
        openLesson(ui,k);
        const n=ses.steps.length;
        for(let i=0;i<n;i++){
          ses.i=i;renderStep();
          if(k==='quiz'){const o=$$('.opt');o[0].click();o[o.length-1].click;}
          if(k==='build'){$$('#bank .chip').forEach((c,j)=>{});$('#bank .chip').click();$('#chk').click();}
          if(k==='speak'){const st=ses.steps[i];const tg=UNITS[ui].dialog.lines[st.i][1];st._test.onCaptured({url:null,alts:[{t:tg,c:0.9}],srErr:null});chk($('.score'),'sem nota');}
        }
        finishSession();chk($('.big-n'),'sem tela de resultado');
      });
    });
    startReview();
    renderHome();
  }catch(ex){errs.push('EXCEÇÃO: '+ex.message+' '+(ex.stack||'').split('\n')[1]);}
  S=defState();try{localStorage.removeItem(KEY);}catch(e){}
  document.title='SELFTEST '+(errs.length?'FAIL':'OK');
  console.log('SELFTEST '+(errs.length?'FAIL\n'+errs.join('\n'):'OK'));
  app.innerHTML='<pre>'+esc(errs.length?errs.join('\n'):'SELFTEST OK')+'</pre>';
}
window.addEventListener('error',e=>{console.log('ERRO JS: '+e.message);});
if(TEST)selfTest();else renderHome();
</script>
</body>
</html>
